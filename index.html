<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MusicFree 插件订阅站</title>
<style>
  /* ============ 全局变量：改这里即可换配色 ============ */
  :root{
    --bg:#0e1014; --card:#171a21; --line:#262b38;
    --txt:#e8eaf0; --sub:#9aa3b5; --acc1:#7c5cff; --acc2:#ff5c8a;
    --ok:#3ecf8e; --mono:'SF Mono',Consolas,Menlo,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
    min-height:100vh;background-image:radial-gradient(900px 400px at 80% -10%,rgba(124,92,255,.18),transparent),
    radial-gradient(700px 350px at 0% 0%,rgba(255,92,138,.12),transparent)}
  .wrap{max-width:1080px;margin:0 auto;padding:48px 20px 60px}
  header{text-align:center;margin-bottom:36px}
  .logo{font-size:52px;line-height:1}
  h1{font-size:30px;font-weight:700;margin:14px 0 8px;
    background:linear-gradient(90deg,var(--acc1),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .tagline{color:var(--sub);font-size:15px}
  .stats{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:5px 14px;font-size:13px;color:var(--sub)}
  .stat b{color:var(--txt)}

  /* 订阅地址卡片 */
  .sub-card{background:linear-gradient(135deg,rgba(124,92,255,.14),rgba(255,92,138,.10)),var(--card);
    border:1px solid rgba(124,92,255,.35);border-radius:16px;padding:22px 24px;margin-bottom:34px}
  .sub-card h2{font-size:17px;margin-bottom:4px}
  .sub-card p.tip{color:var(--sub);font-size:13px;margin-bottom:14px}
  .eco-note{border-left:3px solid var(--ok);padding-left:10px;margin:-2px 0 14px;color:var(--txt)!important}
  .sub-row{display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.35);border:1px solid var(--line);
    border-radius:10px;padding:10px 12px;margin-bottom:10px;flex-wrap:wrap}
  .sub-row .label{font-size:12px;color:var(--acc1);border:1px solid rgba(124,92,255,.5);border-radius:6px;padding:2px 8px;white-space:nowrap}
  .sub-row code,.sub-row .code-link{flex:1;font-family:var(--mono);font-size:13px;color:#cdd3e0;word-break:break-all;min-width:200px}
  a.code-link{color:#9db8ff;text-decoration:none;border-bottom:1px dashed rgba(157,184,255,.4);padding-bottom:1px}
  a.code-link:hover{color:#c3d4ff;border-bottom-color:#c3d4ff}
  .btn{border:none;border-radius:8px;padding:7px 14px;font-size:13px;cursor:pointer;font-weight:600;white-space:nowrap;
    background:linear-gradient(90deg,var(--acc1),var(--acc2));color:#fff;transition:opacity .15s}
  .btn:hover{opacity:.85}
  .btn.ghost{background:transparent;color:var(--sub);border:1px solid var(--line);font-weight:400}
  .btn.ghost:hover{color:var(--txt);border-color:var(--sub)}
  .copied{background:var(--ok)!important}
  .px-head{font-size:15px;font-weight:700;margin:18px 0 2px;display:flex;align-items:center;gap:8px}
  .px-head::before{content:'🛡️';font-size:14px}
  .sub-row .spd{font-size:11px;color:var(--ok);font-family:var(--mono);white-space:nowrap;background:rgba(62,207,142,.08);border:1px solid rgba(62,207,142,.3);border-radius:6px;padding:2px 8px}
  details.more-sub{margin:12px 0 0;border:1px solid var(--line);border-radius:10px;background:rgba(0,0,0,.25)}
  details.more-sub summary{cursor:pointer;padding:10px 14px;font-size:13px;color:var(--sub);list-style:none}
  details.more-sub summary:hover{color:var(--txt)}
  details.more-sub summary::before{content:'▸ '}
  details.more-sub[open] summary::before{content:'▾ '}
  details.more-sub .inner{padding:2px 12px 10px}

  /* 搜索框 */
  .search-box{position:relative;max-width:420px;margin:0 0 16px}
  .search-box input{width:100%;min-height:44px;background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:10px 42px 10px 14px;font-size:15px;color:var(--txt);outline:none;transition:border-color .15s;-webkit-appearance:none;appearance:none}
  .search-box input:focus{border-color:rgba(124,92,255,.6)}
  .search-box input::placeholder{color:var(--sub)}
  .search-clear{display:none;position:absolute;right:6px;top:50%;transform:translateY(-50%);width:32px;height:32px;
    border:none;border-radius:8px;background:rgba(255,255,255,.06);color:var(--sub);font-size:18px;cursor:pointer;line-height:1;padding:0}
  .search-box.has-text .search-clear{display:flex;align-items:center;justify-content:center}
  .search-clear:hover{color:var(--txt);background:rgba(255,255,255,.12)}

  /* 插件卡片网格 */
  .sec-title{font-size:18px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px}
  .sec-title::before{content:'';width:4px;height:18px;border-radius:2px;background:linear-gradient(180deg,var(--acc1),var(--acc2))}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
  .pcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;
    transition:transform .15s,border-color .15s,box-shadow .15s}
  .pcard:hover{transform:translateY(-3px);border-color:rgba(124,92,255,.55);box-shadow:0 8px 24px rgba(0,0,0,.35)}
  .pcard .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .pcard .name{font-size:16px;font-weight:700}
  .ver{font-size:11px;font-family:var(--mono);color:#d6bcff;background:rgba(124,92,255,.15);
    border:1px solid rgba(124,92,255,.4);border-radius:12px;padding:2px 9px}
  .links{display:flex;gap:8px;flex-wrap:wrap}
  .lnk{font-size:12px;color:var(--sub);border:1px solid var(--line);border-radius:8px;padding:6px 11px;
    text-decoration:none;transition:all .15s;display:inline-flex;align-items:center;gap:4px}
  .lnk:hover{color:var(--txt);border-color:var(--acc1);background:rgba(124,92,255,.08)}
  .lnk.main{color:#ffd7e4;border-color:rgba(255,92,138,.45)}
  .lnk.main:hover{border-color:var(--acc2)}
  .empty-state{grid-column:1/-1;text-align:center;color:var(--sub);padding:44px 16px;
    border:1px dashed var(--line);border-radius:14px;font-size:14px;line-height:1.8}
  .empty-state b{color:var(--txt)}

  footer{margin-top:44px;text-align:center;color:var(--sub);font-size:13px;line-height:2}
  footer a{color:var(--acc1);text-decoration:none}
  footer a:hover{text-decoration:underline}
  .update-time{text-align:center;color:var(--sub);font-size:12px;margin-top:6px;font-family:var(--mono)}
  .demo-note{text-align:center;font-size:12px;color:#ffcf6b;margin-top:8px}
  html{scroll-behavior:smooth}
  @media(max-width:520px){.sub-row code{font-size:11px}.wrap{padding:32px 14px 40px}h1{font-size:24px}.search-box input{font-size:16px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">🎵</div>
    <h1>MusicFree 插件订阅站</h1>
    <div class="tagline">多源聚合 · 一键订阅 · 页面数据自动跟随 plugins.json</div>
    <div class="stats">
      <span class="stat">插件 <b id="stat-count">-</b> 个</span>
      <span class="stat">页面数据 <b>自动跟随 plugins.json</b></span>
    </div>
  </header>

  <!-- ================= 订阅地址区（由 JS 按 CONFIG 渲染） ================= -->
  <div class="sub-card" id="sec-sub">
    <h2>📌 订阅地址</h2>
    <p class="tip">在 MusicFree 中打开「插件设置 → 订阅」，粘贴下面任一地址即可一键安装 / 更新全部插件。</p>
    <div id="sub-rows"></div>

    <details class="more-sub">
      <summary id="more-summary">更多订阅通道（备用 CDN 节点 + 国内代理）</summary>
      <div class="inner" id="sub-rows-more"></div>
    </details>

    <p class="tip" id="sub-tip" style="margin:10px 0 0">以上订阅内容完全一致；哪个通道报 Network Error，就换另一条订阅地址重试。</p>
  </div>

  <!-- ================= 搜索 + 插件列表 ================= -->
  <div class="search-box">
    <input id="plugin-search" type="search" placeholder="搜索插件：名称 / 版本 / 关键词…" autocomplete="off">
    <button type="button" class="search-clear" aria-label="清空搜索">×</button>
  </div>

  <div class="sec-title" id="sec-plugins">插件列表</div>
  <div class="grid" id="grid"><div class="pcard" style="grid-column:1/-1;text-align:center;color:var(--sub)">加载中…</div></div>

  <footer>
    新插件完成后追加进 <a id="link-plugin-json" href="#" target="_blank" rel="noopener">plugins.json</a> 即自动出现在本页<br>
    仓库：<a id="link-repo" href="#" target="_blank" rel="noopener">github.com/&lt;用户名&gt;/&lt;仓库名&gt;</a>
  </footer>
  <div class="update-time" id="update-time"></div>
  <div class="demo-note" id="demo-note"></div>
</div>

<script>
/* ==================================================================
 * CONFIG —— 全站唯一配置区。githubUser / githubRepo 为你的 GitHub
 * 账号与仓库；branch 按仓库实际主分支填写（master 或 main）。
 * ================================================================== */
var CONFIG = {
  githubUser: 'liaowan001',
  githubRepo: 'musicfree-plugins',
  branch: 'main',             // 仓库主分支：master 或 main，按你的仓库实际分支改
  isDemo: true,              // true=当前仍是示例数据；换成真实插件后改为 false 可去掉页面提醒

  /* 订阅通道列表：每一条都会渲染成一行「订阅地址」。
   * file : 通道清单文件名（仓库根目录下）
   * mode : pages=GitHub Pages 直链；ghproxy=经 ghproxy 代理 raw
   * note : 可选，显示在行尾的绿色备注（如测速） */
  channels: [
    { label: '推荐 · GitHub Pages', file: 'plugins.json', mode: 'pages', main: true },
    { label: '国内加速 · ghproxy',  file: 'plugins-ghproxy.json', mode: 'ghproxy' },
    { label: '备用 · fastly 节点',  file: 'plugins-fastly.json',  mode: 'pages' },
    { label: '备用 · gcore 节点',   file: 'plugins-gcore.json',   mode: 'pages' },
    { label: '国内代理 01 · 示例代理', file: 'plugins-proxy-01.json', mode: 'pages', note: '示例 · 替换为实测代理' }
  ],

  /* 兜底数据：fetch plugins.json 失败时（如本地 file:// 直接打开）用这里的数据渲染。
   * 与 plugins.json 保持一致的示例条目。 */
  fallback: [
    { name: '示例·云音乐',   version: '1.0.0', file: 'sample-music-source.plugin.v1.0.0.js' },
    { name: '示例·音乐电台', version: '1.0.0', file: 'sample-radio-source.plugin.v1.0.0.js' },
    { name: '示例·DJ台',     version: '1.0.0', file: 'sample-dj-source.plugin.v1.0.0.js' },
    { name: '示例·有声书',   version: '1.0.0', file: 'sample-audiobook-source.plugin.v1.0.0.js' },
    { name: '示例·轻音乐',   version: '1.0.0', file: 'sample-lofi-source.plugin.v1.0.0.js' },
    { name: '示例·现场Live', version: '1.0.0', file: 'sample-live-source.plugin.v1.0.0.js' }
  ]
};

/* ================= 由 CONFIG 派生的基础 URL ================= */
var BASE = {
  pages: 'https://' + CONFIG.githubUser + '.github.io/' + CONFIG.githubRepo,           // GitHub Pages 根
  raw:   'https://raw.githubusercontent.com/' + CONFIG.githubUser + '/' + CONFIG.githubRepo, // raw 根
  repo:  'https://github.com/' + CONFIG.githubUser + '/' + CONFIG.githubRepo
};
var IS_DEMO = CONFIG.isDemo;

/* ================= 工具函数 ================= */
function esc(s){return (s+'').replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}

/* 订阅地址的完整 URL：mode=pages → Pages 上的清单文件；mode=ghproxy → 经 ghproxy 代理 raw */
function subUrl(ch){
  if(ch.mode === 'ghproxy') return 'https://ghproxy.net/' + BASE.raw + '/' + CONFIG.branch + '/' + ch.file;
  return BASE.pages + '/' + ch.file;
}

/* 单个插件文件的 4 条下载链接（与原站一致的四通道） */
function linksOf(file){
  var f = encodeURIComponent(file);
  return '<a class="lnk main" href="' + BASE.pages + '/plugins/' + f + '" target="_blank" rel="noopener">⚡ Pages 直链</a>'
    + '<a class="lnk" href="https://fastly.jsdelivr.net/gh/' + CONFIG.githubUser + '/' + CONFIG.githubRepo + '@' + CONFIG.branch + '/plugins/' + f + '" target="_blank" rel="noopener">fastly</a>'
    + '<a class="lnk" href="https://gcore.jsdelivr.net/gh/'  + CONFIG.githubUser + '/' + CONFIG.githubRepo + '@' + CONFIG.branch + '/plugins/' + f + '" target="_blank" rel="noopener">gcore</a>'
    + '<a class="lnk" href="' + BASE.raw + '/' + CONFIG.branch + '/plugins/' + f + '" target="_blank" rel="noopener">raw</a>';
}

/* 插件卡片 HTML */
function cardHTML(p){
  var file = (p.url || '').split('/plugins/').pop() || p.file || '';
  return '<div class="pcard"><div class="top"><span class="name">' + esc(p.name) + '</span>'
    + '<span class="ver">v' + esc(p.version) + '</span></div><div class="links">' + linksOf(file) + '</div></div>';
}

/* ================= 渲染订阅地址区 ================= */
function renderSubRows(){
  var html = '', htmlMore = '';
  CONFIG.channels.forEach(function(ch, i){
    var row = '<div class="sub-row">'
      + '<span class="label">' + esc(ch.label) + '</span>'
      + '<a id="url-sub-' + i + '" class="code-link" href="' + subUrl(ch) + '" target="_blank" rel="noopener">' + subUrl(ch) + '</a>'
      + (ch.note ? '<span class="spd">' + esc(ch.note) + '</span>' : '')
      + '<button class="btn' + (ch.main ? '' : ' ghost') + '" data-copy="url-sub-' + i + '">复制</button>'
      + '</div>';
    if (i < 2) html += row; else htmlMore += row;   // 前两条直接展示，其余收进折叠区
  });
  document.getElementById('sub-rows').innerHTML = html;
  document.getElementById('sub-rows-more').innerHTML = htmlMore;
  document.getElementById('more-summary').textContent =
    '更多订阅通道（' + (CONFIG.channels.length - 2) + ' 条备用 · CDN 节点 + 国内代理）';
}

/* ================= 渲染插件列表 ================= */
var allPlugins = [];
function renderGrid(){
  var q = (document.getElementById('plugin-search').value || '').trim().toLowerCase();
  var list = allPlugins.filter(function(p){ return !q || ((p.name + ' ' + (p.version||'') + ' ' + (p.url||'')).toLowerCase().indexOf(q) > -1) });
  var g = document.getElementById('grid');
  if (!list.length) {
    g.innerHTML = '<div class="empty-state">未找到与「<b>' + esc(q) + '</b>」匹配的插件<br>'
      + '<button class="btn ghost" id="clear-search" style="margin-top:12px">清空搜索，查看全部 ' + allPlugins.length + ' 个插件</button></div>';
  } else {
    g.innerHTML = list.map(cardHTML).join('');
  }
  document.getElementById('stat-count').textContent = q ? (list.length + ' / ' + allPlugins.length) : allPlugins.length;
  document.getElementById('update-time').textContent = '数据更新于 ' + new Date().toLocaleString('zh-CN');
}

/* ================= 初始化 ================= */
function initFooter(){
  var j = document.getElementById('link-plugin-json'), r = document.getElementById('link-repo');
  j.href = BASE.raw + '/' + CONFIG.branch + '/plugins.json';
  r.href = BASE.repo;
  r.textContent = 'github.com/' + CONFIG.githubUser + '/' + CONFIG.githubRepo;
  var d = document.getElementById('demo-note');
  d.textContent = IS_DEMO ? '⚠ 当前为示例数据（示例插件仅演示机制），替换为你的真实插件后，请把 CONFIG.isDemo 改为 false。' : '';
}
function loadPlugins(){
  fetch('plugins.json', {cache:'no-store'})
    .then(function(r){ return r.ok ? r.json() : Promise.reject(); })
    .then(function(d){
      allPlugins = (d.plugins && d.plugins.length) ? d.plugins : CONFIG.fallback;
      renderGrid();
    })
    .catch(function(){ allPlugins = CONFIG.fallback; renderGrid(); });
}

renderSubRows();
initFooter();
loadPlugins();

/* ================= 交互：搜索 / 复制 ================= */
document.addEventListener('input', function(e){
  if (!e.target || e.target.id !== 'plugin-search') return;
  var box = e.target.closest('.search-box');
  if (box) box.classList.toggle('has-text', !!e.target.value);
  renderGrid();
});
document.addEventListener('click', function(e){
  var clr = e.target.closest('.search-clear') || e.target.closest('#clear-search');
  if (clr) {
    var box = clr.closest('.search-box') || document.querySelector('#plugin-search').closest('.search-box');
    var inp = box.querySelector('input');
    inp.value = ''; box.classList.remove('has-text');
    if (inp.id === 'plugin-search') renderGrid();
    inp.focus(); return;
  }
  var b = e.target.closest('[data-copy]'); if (!b) return;
  var t = document.getElementById(b.getAttribute('data-copy')).textContent;
  function done(){ var o = b.textContent; b.textContent = '✓ 已复制'; b.classList.add('copied');
    setTimeout(function(){ b.textContent = o; b.classList.remove('copied'); }, 1600); }
  if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(t).then(done, done); }
  else {
    var ta = document.createElement('textarea'); ta.value = t;
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch(x){}
    document.body.removeChild(ta); done();
  }
});
</script>
</body>
</html>
